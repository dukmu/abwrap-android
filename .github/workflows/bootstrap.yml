name: bootstrap-publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message != 'chore: publish abwrap 3.0.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 -d > /tmp/abwrap.zip
          echo '36e85d2cca79a0971025e272dce21f145ed049e4c520e67ad2def05cf24eef0a  /tmp/abwrap.zip' | sha256sum -c -
          rm -rf /tmp/abwrap-unpack
          mkdir -p /tmp/abwrap-unpack
          unzip -q /tmp/abwrap.zip -d /tmp/abwrap-unpack
          test -f /tmp/abwrap-unpack/abwrap-android-3.0.3/CMakeLists.txt

      - name: Publish exact 3.0.3 tree
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/abwrap-unpack/abwrap-android-3.0.3
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: publish abwrap 3.0.3'
          git push origin HEAD:main
